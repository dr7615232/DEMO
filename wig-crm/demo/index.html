<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דמו · CRM אומנות בפאות</title>
<meta name="description" content="תצוגת דמו אינטראקטיבית של מערכת ניהול לעסק פאות — נתונים לדוגמה בלבד.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23C88E7F'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E%D7%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Assistant:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#FAF5F2; --surface:#FFFFFF; --ink:#4A3833; --muted:#A18A83;
    --line:#EDE1DB; --line-soft:#F4ECE8;
    --plum:#5E4642; --plum-deep:#48342F;
    --rose:#C88E7F; --rose-soft:#D8A79A; --rose-wash:#F6E8E2;
    --danger:#B5675C; --danger-wash:#F6E7E4; --ok:#7C9A6E;
    --shadow:0 1px 2px rgba(94,70,66,.05),0 8px 24px rgba(94,70,66,.07);
    --shadow-lg:0 14px 44px rgba(72,52,47,.18);
    --r:14px; --r-sm:9px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  svg{width:16px;height:16px;flex-shrink:0}
  html,body{height:100%}
  body{font-family:"Rubik","Assistant","Heebo","Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:15px}
  ::selection{background:var(--rose-wash)}

  .app{display:grid;grid-template-columns:238px 1fr;height:100vh}
  .sidebar{background:var(--plum);color:#E9DBD6;display:flex;flex-direction:column;padding:16px 12px;overflow:hidden}
  .brand{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 8px 16px;gap:9px}
  .brand-mark{width:56px;height:56px;border-radius:50%;background:linear-gradient(150deg,var(--rose-soft),var(--rose));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:22px;
    box-shadow:0 4px 14px rgba(0,0,0,.22);letter-spacing:.5px}
  .brand-txt{text-align:center;line-height:1.2}
  .brand-txt b{display:block;font-size:16px;font-weight:700;color:#fff}
  .brand-txt span{font-size:11px;color:var(--rose-soft);letter-spacing:.06em}

  .nav{display:flex;flex-direction:column;gap:2px;margin-top:2px;overflow-y:auto}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:right;padding:8px 12px;
    border-radius:var(--r-sm);color:#CDBAB4;font-size:14.5px;font-weight:500;transition:.14s}
  .nav button svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
  .nav button:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav button.active{background:var(--rose);color:#fff}
  .nav button.active svg{opacity:1}
  .nav .sep{height:1px;background:rgba(255,255,255,.09);margin:6px 10px}

  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:5px;padding-top:10px}
  .side-foot .saved{font-size:11px;color:var(--rose-soft);text-align:center;padding-top:4px;opacity:.85}

  .main{overflow-y:auto;position:relative}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(250,245,242,.86);backdrop-filter:blur(10px);
    display:flex;align-items:center;gap:16px;padding:20px 34px 16px;border-bottom:1px solid var(--line-soft)}
  .topbar h1{font-size:23px;font-weight:700;letter-spacing:-.4px;color:var(--plum-deep)}
  .topbar .sub{font-size:13px;color:var(--muted);margin-top:1px}
  .search{margin-inline-start:auto;position:relative;display:flex;align-items:center}
  .search svg{position:absolute;inset-inline-start:12px;width:17px;height:17px;color:var(--muted)}
  .search input{width:210px;padding:9px 14px 9px 36px;border:1px solid var(--line);border-radius:99px;
    background:var(--surface);color:var(--ink);transition:.15s}
  .search input:focus{outline:none;border-color:var(--rose);width:250px;box-shadow:0 0 0 3px var(--rose-wash)}
  .bell-btn{position:relative;width:40px;height:40px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:.15s}
  .bell-btn:hover{color:var(--plum);border-color:var(--rose-soft)}
  .bell-btn svg{width:19px;height:19px}
  .bell-badge{position:absolute;top:-4px;inset-inline-start:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--rose);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(200,142,127,.5)}
  .content{padding:26px 34px 60px}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--r-sm);
    font-size:14px;font-weight:600;transition:.15s;white-space:nowrap}
  .btn svg{width:16px;height:16px}
  .btn-primary{background:var(--plum);color:#fff}
  .btn-primary:hover{background:var(--plum-deep);transform:translateY(-1px);box-shadow:var(--shadow)}
  .btn-rose{background:var(--rose);color:#fff}
  .btn-rose:hover{filter:brightness(.95);transform:translateY(-1px);box-shadow:var(--shadow)}
  .btn-ghost{background:var(--surface);color:var(--plum);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--rose);color:var(--rose)}
  .btn-sm{padding:6px 12px;font-size:13px}

  .rem-strip{background:linear-gradient(180deg,var(--rose-wash),#fff);border:1px solid var(--rose-soft);border-radius:16px;padding:16px 20px;margin-bottom:20px}
  .rem-strip-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(200,142,127,.18)}
  .rem-strip-row:last-child{border-bottom:none}
  .auto-tag{display:inline-flex;vertical-align:-2px;margin-inline-end:5px;color:var(--rose)}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);transition:.14s}
  .stat.clk{cursor:pointer}
  .stat.clk:hover{border-color:var(--rose-soft);transform:translateY(-2px)}
  .stat .k{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:7px}
  .stat .k .dot{width:8px;height:8px;border-radius:99px;background:var(--rose)}
  .stat .v{font-size:29px;font-weight:700;color:var(--plum-deep);margin-top:8px;letter-spacing:-.6px}
  .stat .v small{font-size:15px;font-weight:600;color:var(--muted)}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
  .panel-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
  .panel-head h2{font-size:16px;font-weight:700;color:var(--plum-deep)}
  .panel-head .act{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}

  table{width:100%;border-collapse:collapse}
  th{text-align:right;font-size:12px;font-weight:600;color:var(--muted);padding:11px 20px;
    border-bottom:1px solid var(--line-soft);background:#FCF9F7}
  td{padding:13px 20px;border-bottom:1px solid var(--line-soft);font-size:14px;vertical-align:middle}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:var(--rose-wash)}
  tbody tr:hover .row-actions{opacity:1}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
  .b-dot{width:6px;height:6px;border-radius:99px;background:currentColor}
  .avatar{width:34px;height:34px;border-radius:99px;background:var(--rose-wash);color:var(--plum);
    display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
  .name-cell{display:flex;align-items:center;gap:11px}
  .cell-name{font-weight:600;color:var(--plum-deep)}
  .cell-sub{font-size:12.5px;color:var(--muted)}
  .row-actions{display:flex;gap:4px;justify-content:flex-start;opacity:0;transition:.12s}
  .icon-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.13s}
  .icon-btn:hover{background:var(--rose-wash);color:var(--plum)}
  .icon-btn.del:hover{background:var(--danger-wash);color:var(--danger)}

  .task-row{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--line-soft);transition:.12s}
  .task-row:last-child{border-bottom:none}
  .task-row:hover{background:var(--rose-wash)}
  .check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-strong,#D8CFC9);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent;cursor:pointer}
  .check.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .t-body{flex:1;min-width:0}
  .t-title{font-weight:600;color:var(--plum-deep)}
  .t-title.done{text-decoration:line-through;color:var(--muted);font-weight:500}
  .t-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:9px;margin-top:2px;flex-wrap:wrap}

  /* calendar */
  .cal-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .cal-head h2{font-size:19px;font-weight:700;color:var(--plum-deep);min-width:130px;text-align:center}
  .heb-my{font-size:12px;color:var(--muted);font-weight:500;text-align:center;margin-top:2px}
  .cal-nav{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
    display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:.13s}
  .cal-nav:hover{border-color:var(--rose);color:var(--rose)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .cal-dow{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0}
  .cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:11px;min-height:112px;padding:8px;
    transition:.13s;cursor:pointer;display:flex;flex-direction:column;gap:4px}
  .cal-cell:hover{border-color:var(--rose-soft)}
  .cal-cell.today{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose)}
  .cal-cell.other{background:transparent;border-color:transparent;cursor:default}
  .cal-num{font-size:12.5px;font-weight:600;color:var(--muted);align-self:flex-end}
  .cal-cell.today .cal-num{color:var(--rose);font-weight:700}
  .c-top{display:flex;align-items:center;justify-content:space-between;width:100%;gap:4px}
  .c-num{font-size:12.5px;font-weight:600;color:var(--muted)}
  .cal-cell.today .c-num{color:var(--rose);font-weight:700}
  .c-heb{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap}
  .cal-ev{font-size:11.5px;font-weight:600;border-radius:6px;padding:3px 6px;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-ev .ev-t{opacity:.75;font-weight:700;margin-inline-end:3px}

  /* finances */
  .set-tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .set-tab{padding:10px 18px;font-size:14.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;transition:.13s}
  .set-tab.on{color:var(--plum-deep);border-bottom-color:var(--rose)}
  .seg-ctrl{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
  .seg-btn{padding:6px 15px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.13s}
  .seg-btn.on{background:var(--rose);color:#fff}
  .fin-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
  @media(max-width:900px){.fin-cards{grid-template-columns:repeat(2,1fr)}}
  .fin-chart{display:flex;align-items:stretch;gap:14px;height:200px;padding:20px}
  .fin-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%}
  .fin-bars{flex:1;display:flex;align-items:flex-end;gap:5px;width:100%;justify-content:center}
  .fin-bar{width:26%;min-height:2px;border-radius:5px 5px 0 0;transition:height .35s}
  .fin-bar.inc{background:linear-gradient(180deg,var(--rose-soft),var(--rose))}
  .fin-bar.exp{background:#C3A79C}
  .fin-lbl{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
  .fin-lbl.cur{color:var(--plum-deep);font-weight:700}
  .fin-legend{display:flex;gap:16px}
  .fin-legend .lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
  .fin-legend .sw{width:11px;height:11px;border-radius:3px}
  .svc-row{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line-soft)}
  .svc-row:last-child{border-bottom:none}
  .svc-bar-wrap{flex:1;height:9px;background:var(--line-soft);border-radius:99px;overflow:hidden}
  .svc-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rose-soft),var(--rose))}
  .svc-cnt{color:var(--muted);font-size:12.5px;min-width:64px;text-align:center}
  .svc-amt{font-weight:700;color:var(--plum-deep);min-width:92px;text-align:left}
  .exp-row{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line-soft);cursor:pointer}
  .exp-row:last-child{border-bottom:none}
  .exp-row:hover{background:var(--rose-wash)}
  .exp-amt{font-weight:700;color:var(--plum-deep);margin-inline-start:auto}
  .kind-pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}
  .kind-in{background:#E7F0E2;color:#4C6540}
  .kind-out{background:#F3E7E2;color:#9A5A45}

  /* deals pipeline */
  .pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:start}
  @media(max-width:1000px){.pipe{grid-template-columns:repeat(2,1fr)}}
  .pipe-col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .pipe-head{padding:11px 14px;font-size:13px;font-weight:700;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px}
  .pipe-head .cnt{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:600}
  .deal-card{padding:12px 14px;border-bottom:1px solid var(--line-soft)}
  .deal-card:last-child{border-bottom:none}
  .deal-card .dt{font-weight:600;color:var(--plum-deep);font-size:13.5px}
  .deal-card .dm{font-size:12px;color:var(--muted);margin-top:2px}
  .deal-card .dv{font-weight:700;color:var(--rose);font-size:13px;margin-top:5px}

  /* settings services */
  .svc-card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
  .svc-card-head{display:flex;align-items:center;gap:11px;padding:14px 18px;background:#FCF9F7;border-bottom:1px solid var(--line-soft)}
  .svc-card-head h3{font-size:15px;font-weight:700;color:var(--plum-deep)}
  .sub-row{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line-soft)}
  .sub-row:last-child{border-bottom:none}
  .sub-name{font-weight:600;color:var(--ink);flex:1}
  .sub-price{font-weight:700;color:var(--plum-deep);min-width:80px;text-align:left}
  .sub-cost{font-size:12.5px;color:var(--muted);min-width:150px;text-align:left}
  .cost-tag{background:var(--rose-wash);color:var(--plum);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .info-note{display:flex;gap:11px;align-items:flex-start;background:var(--rose-wash);border:1px solid var(--rose-soft);
    border-radius:12px;padding:13px 16px;margin-bottom:18px;font-size:13.5px;color:var(--plum-deep);line-height:1.55}
  .info-note svg{color:var(--rose);margin-top:2px}

  .view{display:none}
  .view.on{display:block;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .demo-tag{position:fixed;inset-block-end:14px;inset-inline-start:14px;z-index:60;background:var(--plum-deep);color:#fff;
    font-size:12px;font-weight:600;padding:8px 14px;border-radius:99px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:7px}
  .demo-tag .d{width:7px;height:7px;border-radius:99px;background:var(--rose);box-shadow:0 0 0 3px rgba(200,142,127,.35)}

  @media(max-width:820px){
    .app{grid-template-columns:1fr}
    .sidebar{display:none}
    .content{padding:18px}
    .topbar{padding:16px 18px 12px}
    .stat-row{grid-template-columns:repeat(2,1fr)}
    .two-col{grid-template-columns:1fr}
    .fin-cards{grid-template-columns:repeat(2,1fr)}
    .mnav{display:flex !important}
  }
  .mnav{display:none;gap:6px;overflow-x:auto;padding:10px 18px 0;background:var(--bg);position:sticky;top:0;z-index:19}
  .mnav button{white-space:nowrap;padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;
    color:var(--plum);background:var(--surface);border:1px solid var(--line)}
  .mnav button.active{background:var(--rose);color:#fff;border-color:var(--rose)}
</style>
</head>
<body>
<div class="app">
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">א‌ב</div>
      <div class="brand-txt"><b>אומנות בפאות</b><span>ניהול העסק</span></div>
    </div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="active" onclick="go('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        לוח בקרה</button>
      <button data-view="calendar" onclick="go('calendar')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2.5"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        יומן</button>
      <button data-view="clients" onclick="go('clients')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        לקוחות</button>
      <button data-view="tasks" onclick="go('tasks')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        משימות</button>
      <button data-view="deals" onclick="go('deals')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 3 5-7"/></svg>
        פניות</button>
      <button data-view="finances" onclick="go('finances')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="5" rx="1"/><rect x="12" y="8" width="3" height="9" rx="1"/><rect x="17" y="5" width="3" height="12" rx="1"/></svg>
        כספים</button>
      <div class="sep"></div>
      <button data-view="settings" onclick="go('settings')">

const ico={

/* date helpers relative to today */
const HE_MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const HE_DOW=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
function dOff(off){const d=new Date(TODAY);d.setDate(d.getDate()+off);return d;}
function evDate(e){return dOff(e.date);}
function itemsTotal(its){return its.reduce((a,i)=>a+(Number(i.price)||0),0);}
function evTotal(e){return itemsTotal(e.items);}
function evPending(e){return e.items.length && e.items.every(i=>!i.sub);} /* booked, no sub yet */

/* ---- Hebrew (Jewish) calendar dates — faithful to the original ---- */
let _hebFmt=null;
try{ _hebFmt=new Intl.DateTimeFormat("he-u-ca-hebrew-nu-latn",{day:"numeric",month:"long",year:"numeric"}); }catch(e){}
function gematria(num){
  if(!num||num<1) return "";
  const ones=["","א","ב","ג","ד","ה","ו","ז","ח","ט"],tens=["","י","כ","ל","מ","נ","ס","ע","פ","צ"],huns=["","ק","ר","ש","ת","תק","תר","תש","תת","תתק"];
  let n=num,res=huns[Math.floor(n/100)]||""; n%=100;
  if(n===15) res+="טו"; else if(n===16) res+="טז"; else { res+=tens[Math.floor(n/10)]||""; res+=ones[n%10]||""; }
  if(res.length===1) res+="׳"; else res=res.slice(0,-1)+"״"+res.slice(-1);
  return res;
}
function hebPartsOf(d){ const o={}; if(!_hebFmt) return o;
  try{ _hebFmt.formatToParts(d).forEach(p=>{ if(p.type==="day")o.day=+p.value; else if(p.type==="month")o.month=p.value; else if(p.type==="year")o.year=+p.value; }); }catch(e){}
  return o; }
function hebDay(d){ const p=hebPartsOf(d); return p.day?gematria(p.day):""; }
function hebFull(dt){ const d=(dt instanceof Date)?dt:new Date(dt+"T12:00:00"); const p=hebPartsOf(d); if(!p.day) return ""; return gematria(p.day)+" ב"+p.month+" "+gematria(p.year%1000); }
function hebMonthYear(d){ const p=hebPartsOf(d); if(!p.month) return ""; return p.month+" "+gematria(p.year%1000); }

  const open=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);
  document.getElementById("v-tasks").innerHTML=`
    <div class="info-note">${ico.info}<div>חלק מהמשימות נוצרות <b>לבד</b>: יום לפני תור סירוק נפתחת תזכורת לחפוף את הפאה, ולפני יום הולדת של לקוחה נפתחת תזכורת לברך. הן מסומנות בפעמון.</div></div>
    <div class="panel">
      <div class="panel-head"><h2>לביצוע (${open.length})</h2><div class="act"><button class="btn btn-primary btn-sm" onclick="toast('משימה חדשה')">${ico.plus} משימה</button></div></div>
      ${open.sort((a,b)=>a.due-b.due).map(t=>taskRow(t)).join("")}
    </div>
    <div class="panel">
      <div class="panel-head"><h2>הושלמו (${done.length})</h2></div>
      ${done.map(t=>taskRow(t)).join("")||'<div class="empty">אין עדיין</div>'}
    </div>`;
}

function renderDeals(){
  const cols=dealStages.map(st=>{
    const list=deals.filter(d=>d.stageId===st.id);
    const sw=SWATCHES[st.color];
    return `<div class="pipe-col">
      <div class="pipe-head"><span class="b-dot" style="background:${sw.dot}"></span>${st.label}<span class="cnt">${list.length}</span></div>
      ${list.map(d=>`<div class="deal-card"><div class="dt">${d.title}</div>
        <div class="dm">${d.clientId?clientName(d.clientId):"ללא לקוחה"}</div>
        ${d.value?`<div class="dv">${money(d.value)}</div>`:""}</div>`).join("")||'<div class="empty" style="padding:22px;font-size:13px">—</div>'}
    </div>`;}).join("");
  document.getElementById("v-deals").innerHTML=`
    <div class="panel-head" style="background:none;border:none;padding:0 0 16px">
      <h2 style="font-size:16px">צנרת הפניות</h2>
      <div class="act"><button class="btn btn-primary btn-sm" onclick="toast('פנייה חדשה')">${ico.plus} פנייה</button></div></div>
    <div class="pipe">${cols}</div>`;
}

/* ---- calendar ---- */
let calMonth=TODAY.getMonth(), calYear=TODAY.getFullYear();
function renderCalendar(){
  const first=new Date(calYear,calMonth,1);
  const startDow=first.getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const cells=[];
  for(let i=0;i<startDow;i++)cells.push(null);
  for(let d=1;d<=days;d++)cells.push(d);
  const evByDay={};
  events.forEach(e=>{const dt=evDate(e);if(dt.getMonth()===calMonth&&dt.getFullYear()===calYear){(evByDay[dt.getDate()]=evByDay[dt.getDate()]||[]).push(e);}});
  const grid=HE_DOW.map(d=>`<div class="cal-dow">${d}</div>`).join("")+cells.map(d=>{
    if(d===null)return `<div class="cal-cell other"></div>`;
    const isToday=d===TODAY.getDate()&&calMonth===TODAY.getMonth()&&calYear===TODAY.getFullYear();
    const evs=(evByDay[d]||[]).sort((a,b)=>a.time.localeCompare(b.time));
    const hd=hebDay(new Date(calYear,calMonth,d,12));
    return `<div class="cal-cell ${isToday?'today':''}">
      <div class="c-top"><span class="c-num">${d}</span><span class="c-heb">${hd}</span></div>
      ${evs.slice(0,3).map(e=>{const svc=e.items[0]?services.find(s=>s.id===e.items[0].svc):null;const sw=svc?SWATCHES[svc.color]:SWATCHES.taupe;
        return `<div class="cal-ev" style="background:${sw.bg};color:${sw.fg}" title="${e.title}"><span class="ev-t">${e.time}</span>${e.type==='event'?e.title:clientName(e.clientId)}</div>`;}).join("")}
      ${evs.length>3?`<div class="cell-sub" style="padding-inline-start:4px">+${evs.length-3} עוד</div>`:""}
    </div>`;
  }).join("");
  const hebStart=hebMonthYear(new Date(calYear,calMonth,1,12)),hebEnd=hebMonthYear(new Date(calYear,calMonth,days,12));
  const hebLabel=hebStart===hebEnd?hebStart:hebStart+" – "+hebEnd;
  document.getElementById("v-calendar").innerHTML=`
    <div class="cal-head">
      <button class="cal-nav" onclick="calStep(1)">${ico.chevR}</button>
      <div><h2>${HE_MONTHS[calMonth]} ${calYear}</h2>${hebLabel?`<div class="heb-my">${hebLabel}</div>`:""}</div>
      <button class="cal-nav" onclick="calStep(-1)">${ico.chevL}</button>
      <button class="btn btn-ghost btn-sm" onclick="calToday()">היום</button>
      <div class="act" style="margin-inline-start:auto"><button class="btn btn-primary btn-sm" onclick="toast('קביעת תור: יום + לקוחה + שירות')">${ico.plus} תור חדש</button></div>
    </div>
    <div class="info-note">${ico.info}<div>קביעת תור היא דו־שלבית: בטלפון בוחרים יום, לקוחה ושירות. <b>בהגעה</b> פותחים את התור ומסמנים את תת־השירות שנרכש, והמחיר נכנס אוטומטית.</div></div>
    <div class="cal-grid">${grid}</div>`;
}
function calStep(dir){calMonth+=dir;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}renderCalendar();}
function calToday(){calMonth=TODAY.getMonth();calYear=TODAY.getFullYear();renderCalendar();}

/* ---- finances ---- */
let finTab="overview";
function sumIncome(){return payments.reduce((a,p)=>a+p.amount,0);}
function sumCOGS(){return events.filter(e=>e.date<=0).reduce((a,e)=>a+e.items.reduce((b,i)=>b+(Number(i.cost)||0),0),0);}
function sumExpense(){return expenses.reduce((a,e)=>a+e.amount,0);}
function netProfit(){return sumIncome()-sumCOGS()-sumExpense();}
function renderFinances(){
  const tab=(id,l)=>`<button class="set-tab ${finTab===id?'on':''}" onclick="setFinTab('${id}')">${l}</button>`;
  const tabs=`<div class="set-tabs">${tab("overview","תמונת מצב")}${tab("transactions","הכנסות והוצאות")}${tab("upcoming","תשלומים צפויים")}${tab("suppliers","ספקים")}</div>`;
  let body;
  if(finTab==="transactions")body=finTransactions();
  else if(finTab==="upcoming")body=finUpcoming();
  else if(finTab==="suppliers")body=finSuppliers();
  else body=finOverview();
  document.getElementById("v-finances").innerHTML=tabs+body;
}
function setFinTab(t){finTab=t;renderFinances();}
function finPeriodBar(){
  return `<div style="display:flex;align-items:center;margin-bottom:16px;gap:14px;flex-wrap:wrap">
    <div class="seg-ctrl"><button class="seg-btn on">חודש</button><button class="seg-btn">רבעון</button><button class="seg-btn">שנה</button></div>
    <div class="cal-head" style="margin:0"><button class="cal-nav" onclick="toast('חודש קודם')">${ico.chevR}</button>
      <div style="min-width:120px"><h2 style="font-size:16px">${HE_MONTHS[TODAY.getMonth()]} ${TODAY.getFullYear()}</h2><div class="heb-my">${hebMonthYear(new Date(TODAY.getFullYear(),TODAY.getMonth(),15,12))}</div></div>
      <button class="cal-nav" onclick="toast('חודש הבא')">${ico.chevL}</button></div>
    <div class="act" style="margin-inline-start:auto;display:flex;gap:8px">
      <button class="btn btn-primary btn-sm" onclick="toast('רישום הכנסה')">${ico.plus} הכנסה</button>
      <button class="btn btn-rose btn-sm" onclick="toast('רישום הוצאה')">${ico.plus} הוצאה</button></div>
  </div>`;
}
function finOverview(){
  const income=sumIncome(),cogs=sumCOGS(),expense=sumExpense(),net=income-cogs-expense;
  const trend=[["מאי",4200,1800],["יוני",5100,2100],["יולי",3800,1600],["אוג׳",6200,2400],["ספט׳",4600,1900],[HE_MONTHS[TODAY.getMonth()].slice(0,4),income,cogs+expense]];
  const maxV=Math.max(...trend.map(t=>Math.max(t[1],t[2])));
  const chart=trend.map((b,i)=>`<div class="fin-col">
    <div class="fin-bars"><div class="fin-bar inc" style="height:${(b[1]/maxV*100).toFixed(0)}%" title="הכנסות ${money(b[1])}"></div>
      <div class="fin-bar exp" style="height:${(b[2]/maxV*100).toFixed(0)}%" title="הוצאות ${money(b[2])}"></div></div>
    <div class="fin-lbl ${i===5?'cur':''}">${b[0]}</div></div>`).join("");
  /* per-service */
  const svcAgg=services.map(s=>{
    const evs=events.filter(e=>e.date<=0&&e.items.some(i=>i.svc===s.id));
    const total=evs.reduce((a,e)=>a+e.items.filter(i=>i.svc===s.id).reduce((b,i)=>b+i.price,0),0);
    return {id:s.id,total,count:evs.length};
  }).filter(r=>r.total).sort((a,b)=>b.total-a.total);
  const svcMax=Math.max(...svcAgg.map(r=>r.total),1);
  /* open debts */
  const debts=events.filter(e=>e.date<=0&&evTotal(e)>0).map(e=>({name:clientName(e.clientId),owed:evTotal(e)-paidFor(e)})).filter(d=>d.owed>0.5);
  return finPeriodBar()+`
  <div class="fin-cards">
    <div class="stat"><div class="k"><span class="dot" style="background:var(--rose)"></span>הכנסות מלקוחות</div><div class="v">${money(income)}</div></div>
    <div class="stat"><div class="k"><span class="dot" style="background:#B0648A"></span>עלות לספקים</div><div class="v">${money(cogs)}</div></div>
    <div class="stat"><div class="k"><span class="dot" style="background:#C3A79C"></span>הוצאות אחרות</div><div class="v">${money(expense)}</div></div>
    <div class="stat" style="border:1.5px solid var(--ok)"><div class="k"><span class="dot" style="background:var(--ok)"></span>רווח נקי — כמה נשאר לך</div><div class="v" style="color:var(--ok)">${money(net)}</div></div>
  </div>
  ${debts.length?`<div class="panel"><div class="panel-head"><h2>חובות פתוחים — לקוחות שטרם שילמו</h2>
    <div class="act"><span class="cell-sub" style="font-weight:700;color:var(--danger)">סה"כ ${money(debts.reduce((a,d)=>a+d.owed,0))}</span></div></div>
    ${debts.map(d=>`<div class="exp-row"><div style="flex:1"><div style="font-weight:600;color:var(--plum-deep)">${d.name}</div></div>
      <div class="exp-amt" style="color:var(--danger)">${money(d.owed)}</div></div>`).join("")}</div>`:""}
  <div class="panel">
    <div class="panel-head"><h2>מגמה — 6 חודשים אחרונים</h2>
      <div class="fin-legend act"><span class="lg"><span class="sw" style="background:var(--rose)"></span>הכנסות</span><span class="lg"><span class="sw" style="background:#C3A79C"></span>הוצאות</span></div></div>
    <div class="fin-chart">${chart}</div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>לפי שירות</h2></div>
    ${svcAgg.map(r=>`<div class="svc-row"><div style="min-width:104px">${svcBadge(r.id)}</div>
      <div class="svc-bar-wrap"><div class="svc-bar" style="width:${(r.total/svcMax*100).toFixed(0)}%"></div></div>
      <div class="svc-cnt">${r.count} תורים</div><div class="svc-amt">${money(r.total)}</div></div>`).join("")}
  </div>`;
}
function paidFor(e){const p=payments.find(p=>p.clientId===e.clientId);return e.id==="e2"?2000:(e.id==="e8"?650:e.id==="e9"?150:(p&&e.date<0?evTotal(e):0));}
function finTransactions(){
  const rows=[...payments.map(p=>({t:"in",name:clientName(p.clientId),desc:p.svcLabel,amount:p.amount,method:methods[p.method]})),
    ...expenses.filter(e=>e.amount).map(e=>({t:"out",name:e.title,desc:e.cat,amount:e.amount,method:""}))];
  return finPeriodBar()+`<div class="panel">
    <div class="panel-head"><h2>תנועות החודש</h2></div>
    ${rows.map(r=>`<div class="exp-row">
      <span class="kind-pill ${r.t==='in'?'kind-in':'kind-out'}">${r.t==='in'?'הכנסה':'הוצאה'}</span>
      <div style="flex:1"><div style="font-weight:600;color:var(--plum-deep)">${r.name}</div><div class="cell-sub">${r.desc}${r.method?' · '+r.method:''}</div></div>
      <div class="exp-amt" style="color:${r.t==='in'?'var(--ok)':'var(--danger)'}">${r.t==='in'?'+':'−'}${money(r.amount)}</div></div>`).join("")}
  </div>`;
}
function finUpcoming(){
  const items=[
    {label:"תשלום אשראי — פאה חדשה (2 מתוך 3)",when:"בעוד שבועיים",amount:800,kind:"card"},
    {label:"תשלום לספק — יתרת חוב פתוחה",when:"סוף החודש",amount:500,kind:"supplier"},
    {label:"תשלום אשראי — שדרוג (3 מתוך 3)",when:"החודש הבא",amount:217,kind:"card"},
  ];
  return `<div class="info-note">${ico.info}<div>תחזית ל־6 חודשים קדימה: פריסת תשלומי האשראי של הלקוחות והחוב שנותר לספקים, כדי לדעת מראש מה נכנס ומה יוצא.</div></div>
  <div class="panel"><div class="panel-head"><h2>תשלומים צפויים</h2></div>
    ${items.map(it=>`<div class="exp-row"><span class="kind-pill ${it.kind==='card'?'kind-in':'kind-out'}">${it.kind==='card'?'ייכנס':'ייצא'}</span>
      <div style="flex:1"><div style="font-weight:600;color:var(--plum-deep)">${it.label}</div><div class="cell-sub">${it.when}</div></div>
      <div class="exp-amt">${money(it.amount)}</div></div>`).join("")}</div>`;
}
function finSuppliers(){
  const owed=2900,paid=1500,bal=owed-paid;
  return `<div class="info-note">${ico.info}<div>לכל ספק חשבון מתגלגל: כל מכירה של מוצר יוצרת אוטומטית חיוב בחשבון הספק. <b>מה שהוא מגיע לו</b> פחות <b>מה שכבר שילמת</b> = היתרה. אין צורך לרשום שום דבר ידנית.</div></div>
  <div class="panel"><div class="panel-head"><h2>ספק ראשי</h2>
    <div class="act"><button class="btn btn-rose btn-sm" onclick="toast('רישום תשלום לספק')">${ico.plus} תשלום לספק</button></div></div>
    <div class="fin-cards" style="padding:20px;margin:0;grid-template-columns:repeat(3,1fr)">
      <div class="stat"><div class="k"><span class="dot" style="background:#B0648A"></span>סה"כ חיובים (מכירות)</div><div class="v">${money(owed)}</div></div>
      <div class="stat"><div class="k"><span class="dot" style="background:var(--ok)"></span>שולם עד כה</div><div class="v">${money(paid)}</div></div>
      <div class="stat" style="border:1.5px solid var(--danger)"><div class="k"><span class="dot" style="background:var(--danger)"></span>נותר לשלם</div><div class="v" style="color:var(--danger)">${money(bal)}</div></div>
    </div>
    <table><thead><tr><th>תאריך</th><th>פעולה</th><th>לקוחה</th><th style="text-align:left">סכום</th></tr></thead><tbody>
      <tr><td>${fmtDate(iso(dOff(0)))}</td><td>חיוב · פאה חדשה</td><td>שירה כהן</td><td style="text-align:left;color:var(--danger);font-weight:700">${money(2000)}</td></tr>
      <tr><td>${fmtDate(iso(dOff(-9)))}</td><td>חיוב · פאה יד שנייה</td><td>אורלי דהן</td><td style="text-align:left;color:var(--danger);font-weight:700">${money(900)}</td></tr>
      <tr><td>${fmtDate(iso(dOff(-6)))}</td><td>תשלום לספק</td><td>—</td><td style="text-align:left;color:var(--ok);font-weight:700">${money(1500)}</td></tr>
    </tbody></table>
  </div>`;
}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

function renderSettings(){
  const cards=services.map(s=>{
    const sw=SWATCHES[s.color];
    return `<div class="svc-card">
      <div class="svc-card-head"><span class="badge" style="background:${sw.bg};color:${sw.fg}"><span class="b-dot" style="background:${sw.dot}"></span>${s.label}</span>
        <div style="margin-inline-start:auto"><button class="btn btn-ghost btn-sm" onclick="toast('הוספת תת־שירות')">${ico.plus} תת־שירות</button></div></div>
      ${s.subs.map(sub=>`<div class="sub-row">
        <div class="sub-name">${sub.label}</div>
        <div class="sub-price">${money(sub.price)}</div>
        <div class="sub-cost">${sub.cost?`<span class="cost-tag">עלות ${money(sub.cost)} · ${sub.man}</span>`:'<span style="color:var(--muted)">שירות — ללא עלות</span>'}</div>
      </div>`).join("")}</div>`;}).join("");
  document.getElementById("v-settings").innerHTML=`
    <div class="info-note">${ico.info}<div><b>העלות והספק מחוברים לתת־השירות, לא לתשלום.</b> כך כל מכירה יודעת לבד מה הרווח האמיתי וכמה מגיע לספק — והלקוחה אף פעם לא רואה את שדות העלות. היא רואה רק את המחיר.</div></div>
    <div class="panel" style="padding:20px">
      <div class="panel-head" style="padding:0 0 16px;border:none"><h2>שירותים ומחירון</h2>
        <div class="act"><button class="btn btn-primary btn-sm" onclick="toast('הוספת שירות')">${ico.plus} שירות</button></div></div>
      ${cards}
    </div>
    <div class="two-col">
      <div class="panel"><div class="panel-head"><h2>אמצעי תשלום</h2></div>
        <div style="padding:16px 20px;display:flex;gap:8px;flex-wrap:wrap">${Object.values(methods).map(m=>`<span class="badge" style="background:var(--rose-wash);color:var(--plum)">${m}</span>`).join("")}</div></div>
      <div class="panel"><div class="panel-head"><h2>אוטומציות</h2></div>
        <div class="task-row"><span class="auto-tag">${ico.bell}</span><div class="t-body"><div class="t-title">תזכורת לחפוף פאה</div><div class="t-meta">יום לפני תור סירוק</div></div><span class="badge" style="background:#C8DCBD;color:#47643A">פעיל</span></div>
        <div class="task-row"><span class="auto-tag">${ico.bell}</span><div class="t-body"><div class="t-title">ברכת יום הולדת ללקוחה</div><div class="t-meta">3 ימים לפני</div></div><span class="badge" style="background:#C8DCBD;color:#47643A">פעיל</span></div>
      </div>
    </div>`;
}

/* ============ router ============ */
const TITLES={dashboard:["לוח בקרה","מבט על מהיר"],calendar:["יומן","תורים וארועים"],
  clients:["לקוחות","כל אנשי הקשר במקום אחד"],tasks:["משימות","מה צריך לקרות ומתי"],
  deals:["פניות","צנרת הפניות והמכירות"],finances:["כספים","הכנסות והוצאות לפי חודשים"],
  settings:["ניהול והגדרות","שליטה בשדות, סטטוסים והמחירון"]};
const RENDER={dashboard:renderDashboard,calendar:renderCalendar,clients:renderClients,
  tasks:renderTasks,deals:renderDeals,finances:renderFinances,settings:renderSettings};
function go(v){
  document.querySelectorAll(".view").forEach(s=>s.classList.remove("on"));
  document.getElementById("v-"+v).classList.add("on");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
  document.querySelectorAll(".mnav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
  document.getElementById("pg-title").textContent=TITLES[v][0];
  document.getElementById("pg-sub").textContent=TITLES[v][1];
  RENDER[v]();
  document.querySelector(".main").scrollTop=0;
}

/* toast */
let toastTimer;
function toast(msg){
  let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";
    t.style.cssText="position:fixed;inset-block-end:56px;inset-inline-start:50%;transform:translateX(50%);background:var(--plum-deep);color:#fff;padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:80;box-shadow:var(--shadow-lg);opacity:0;transition:.2s";
    document.body.appendChild(t);}
  t.textContent="דמו · "+msg;t.style.opacity="1";
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity="0",1700);
}

/* mobile nav */
(function(){const mnav=document.getElementById("mnav");
  Object.keys(TITLES).forEach(v=>{const b=document.createElement("button");b.dataset.view=v;b.textContent=TITLES[v][0];
    if(v==="dashboard")b.classList.add("active");b.onclick=()=>go(v);mnav.appendChild(b);});})();

go("dashboard");
</script>
</body>
