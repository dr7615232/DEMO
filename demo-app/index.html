<title>מערכת זרמים · דמו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">

<style>
  :root{
    --brand:#1B6E9B; --soft:#3FA9DD; --accent:#E05A79;
    --bg:#f7f9fa; --line:#e3edf2; --ink:#1a2b36; --muted:#6b7f8a;
    --card-shadow:0 18px 40px -34px rgba(6,58,82,.45);
  }
  *{box-sizing:border-box}
  html{direction:rtl}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; font-feature-settings:"kern"}
  a{color:inherit;text-decoration:none} button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

  .shell{display:flex; min-height:100vh; flex-direction:column}
  @media(min-width:900px){ .shell{flex-direction:row} }

  /* sidebar */
  .side{position:relative; overflow:hidden; color:#fff; background:linear-gradient(to bottom,#0e7ea6,#1B6E9B,#0a3d56); box-shadow:0 10px 30px -12px rgba(0,0,0,.4)}
  @media(min-width:900px){ .side{position:sticky; top:0; height:100vh; width:16rem; flex:none; display:flex; flex-direction:column} }
  .bubbles{position:absolute; inset:0; overflow:hidden; pointer-events:none; opacity:.4}
  .bubbles i{position:absolute; bottom:-24px; border-radius:9999px; background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.75), rgba(255,255,255,.04)); animation:rise linear infinite}
  @keyframes rise{to{transform:translateY(-100vh); opacity:0}}
  .side-head{position:relative; z-index:10; border-bottom:1px solid rgba(255,255,255,.1); padding:1.25rem}
  .side-head img{height:3.5rem; width:auto; filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
  .who{margin-top:.75rem; font-size:.75rem; color:rgba(255,255,255,.7)}
  .deptsw{margin-top:.75rem; display:flex; gap:.25rem; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1); border-radius:9999px; padding:.25rem}
  .deptsw button{flex:1; border:0; cursor:pointer; border-radius:9999px; padding:.375rem .5rem; font-size:.75rem; font-weight:700; color:rgba(255,255,255,.7); background:transparent; transition:.15s}
  .deptsw button.on-wa{background:var(--accent); color:#fff}
  .deptsw button.on-sw{background:var(--soft); color:#fff}
  .nav{position:relative; z-index:10; flex:1; overflow-y:auto; padding:.5rem}
  .nav ul{list-style:none; margin:0; padding:.25rem .75rem .75rem; display:flex; gap:.25rem; overflow-x:auto}
  @media(min-width:900px){ .nav ul{flex-direction:column; overflow:visible} }
  .nav a{display:flex; align-items:center; gap:.625rem; white-space:nowrap; border-radius:.5rem; padding:.5rem .75rem; font-size:.875rem; color:rgba(255,255,255,.8); transition:.15s; cursor:pointer}
  .nav a:hover{background:rgba(255,255,255,.1)}
  .nav a.active{background:#fff; color:var(--brand); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .nav a svg{width:1.25rem; height:1.25rem; flex:none}
  .side-foot{position:relative; z-index:10; border-top:1px solid rgba(255,255,255,.1); padding:.75rem}
  .side-foot button{width:100%; border:1px solid rgba(255,255,255,.25); background:transparent; cursor:pointer; border-radius:.5rem; padding:.5rem 1rem; font-size:.875rem; font-weight:500; color:rgba(255,255,255,.9); transition:.15s}
  .side-foot button:hover{background:rgba(255,255,255,.15)}

  main{flex:1; background:linear-gradient(to bottom left,#f5fafc,#eaf3f7); padding:1.25rem}
  @media(min-width:900px){ main{padding:2rem} }
  .screen[hidden]{display:none}

  .pagehead{margin-bottom:1.5rem; display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; flex-wrap:wrap}
  .pagehead h1{margin:0; font-size:1.6rem; font-weight:800; letter-spacing:-.01em; color:var(--brand)}
  .pagehead p{margin:.25rem 0 0; font-size:.875rem; color:#7c8b95; max-width:60ch}
  .btn{border:0; cursor:pointer; border-radius:9999px; padding:.5rem 1.1rem; font-size:.85rem; font-weight:600; color:#fff; background:linear-gradient(135deg,#ef5d80,#d43e64); box-shadow:0 10px 22px -10px rgba(239,93,128,.8); transition:.15s}
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{background:#fff; color:var(--brand); border:1px solid var(--line); box-shadow:none}
  .btn.blue{background:linear-gradient(135deg,#0e7ea6,#0a5570); box-shadow:0 8px 18px -10px rgba(10,85,112,.8)}

  .grid{display:grid; gap:1rem}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1100px){ .g4{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:760px){ .g2,.g3,.g4{grid-template-columns:1fr} }
  .card{background:#fff; border:1px solid var(--line); border-radius:1rem; padding:1.25rem; box-shadow:var(--card-shadow)}

  .stat{position:relative; overflow:hidden; border-radius:1rem; border:1px solid; padding:1.25rem; box-shadow:0 18px 40px -32px rgba(6,58,82,.6)}
  .stat .lab{font-size:.75rem; font-weight:500; opacity:.8}
  .stat .val{margin-top:.25rem; font-weight:800; font-variant-numeric:tabular-nums; font-size:1.6rem}
  .stat .val.big{font-size:2.25rem}
  .stat .wbar{position:absolute; inset-inline:0; bottom:0; height:.375rem; background:currentColor; opacity:.5}
  .t-accent{border-color:rgba(224,90,121,.3); background:rgba(224,90,121,.1); color:var(--accent)}
  .t-soft{border-color:rgba(63,169,221,.3); background:rgba(63,169,221,.1); color:var(--soft)}
  .t-brand{border-color:rgba(27,110,155,.2); background:rgba(27,110,155,.05); color:var(--brand)}
  .t-amber{border-color:#fde68a; background:#fffbeb; color:#b45309}
  .t-green{border-color:#bbf7d0; background:#f0fdf4; color:#15803d}

  h3.sec{margin:0 0 .75rem; font-weight:600; color:var(--brand)}
  h2.sec{margin:2rem 0 .25rem; font-size:1.15rem; font-weight:700; color:var(--brand)}
  h2.sec:first-child{margin-top:0}
  .subtle{font-size:.85rem; color:#7c8b95; margin:0 0 .75rem}

  .alert{border-radius:1rem; border:1px solid #fde68a; background:#fffbeb; padding:1rem; margin-bottom:1.5rem}
  .alert h4{margin:0 0 .5rem; font-weight:600; color:#78350f}
  .alert .row{display:flex; align-items:center; justify-content:space-between; border-radius:.5rem; background:#fff; padding:.5rem .75rem; font-size:.875rem; margin-top:.375rem}
  .alert .row b{color:#78350f} .alert .row span{color:#92400e}

  .gcard{position:relative; height:100%; background:#fff; border:1px solid var(--line); border-right:4px solid var(--brand); border-radius:1rem; padding:1.25rem; box-shadow:var(--card-shadow); transition:.15s; cursor:pointer}
  .gcard:hover{box-shadow:0 22px 44px -30px rgba(6,58,82,.5)}
  .gcard .top{display:flex; align-items:flex-start; justify-content:space-between; gap:.5rem}
  .gcard h4{margin:0; font-weight:600; display:flex; align-items:center; gap:.375rem}
  .dot{display:inline-block; width:.625rem; height:.625rem; border-radius:9999px}
  .pill{border-radius:.375rem; padding:.05rem .5rem; font-size:.72rem; white-space:nowrap}
  .pill.free{background:rgba(63,169,221,.2); color:var(--brand)} .pill.full{background:rgba(224,90,121,.2); color:var(--accent)}
  .pill.future{background:rgba(63,169,221,.2); color:var(--brand)}
  .gcard .line1{margin-top:.5rem; font-size:.875rem; color:#4b5b64}
  .gcard .line2{font-size:.75rem; color:#9aa8b1}
  .meter{margin-top:.5rem; height:.625rem; overflow:hidden; border-radius:9999px; background:#eef1f3}
  .meter i{display:block; height:100%; border-radius:9999px}
  .gcard .next{margin-top:.5rem; font-size:.72rem; color:#9aa8b1}
  .gcard .wait{margin-top:.25rem; font-size:.72rem; color:#6b7f8a}
  .gcard .lk{margin-top:.5rem; font-size:.85rem; color:var(--brand)}

  .mini{border-radius:1rem; border:1px solid #e5e7eb; border-right:4px solid var(--brand); background:#fff; padding:1rem}
  .mini .n{font-size:.72rem; color:#6b7f8a; display:flex; align-items:center; gap:.375rem}
  .mini .v{margin-top:.25rem; font-size:1.5rem; font-weight:700}

  .bars{display:flex; height:12rem; align-items:flex-end; gap:1rem}
  .bars .col{flex:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:.25rem}
  .bars .col b{font-size:.72rem; font-weight:600; color:var(--brand)}
  .bars .col i{width:100%; border-radius:.25rem .25rem 0 0; background:linear-gradient(to top,#0a5570,#1B6E9B,#3FA9DD)}
  .xlabels{margin-top:.5rem; display:flex; gap:1rem; border-top:1px solid #eef1f3; padding-top:.5rem}
  .xlabels span{flex:1; text-align:center; font-size:.72rem; color:#6b7f8a}

  .filters{margin-bottom:1rem; display:grid; gap:.75rem; grid-template-columns:repeat(5,1fr)}
  @media(max-width:1100px){ .filters{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:600px){ .filters{grid-template-columns:1fr} }
  .field label{display:block; font-size:.8rem; font-weight:500; margin-bottom:.25rem}
  .field .hint{font-size:.72rem; color:#9aa8b1; margin-top:.2rem}
  .inp,.sel,.ta{width:100%; border:1px solid #cbd5db; border-radius:.75rem; padding:.5rem .75rem; font-family:inherit; font-size:.9rem; background:#fff; color:var(--ink)}
  .ta{line-height:1.6; resize:vertical}
  .inp:focus,.sel:focus,.ta:focus{outline:none; border-color:var(--soft); box-shadow:0 0 0 3px rgba(63,169,221,.25)}
  .clr{align-self:flex-end; border:1px solid #cbd5db; border-radius:.5rem; padding:.5rem 1rem; font-size:.85rem; color:#556; background:#fff; cursor:pointer}

  .addpanel{margin-bottom:1rem; border:1px dashed rgba(63,169,221,.5); border-radius:1rem; background:rgba(63,169,221,.05)}
  .addpanel>button{width:100%; text-align:right; border:0; background:transparent; cursor:pointer; padding:.9rem 1.25rem; font-weight:600; color:var(--brand); display:flex; align-items:center; gap:.5rem}

  .ccard{display:flex; align-items:center; gap:.75rem; background:#fff; border:1px solid var(--line); border-radius:1rem; padding:1rem; box-shadow:var(--card-shadow); transition:.15s; cursor:pointer}
  .ccard:hover{transform:translateY(-2px); border-color:var(--soft)}
  .ava{display:grid; place-items:center; height:2.75rem; width:2.75rem; flex:none; border-radius:.9rem; font-size:1.1rem; font-weight:700; color:#fff}
  .ccard .nm{font-weight:600; display:flex; align-items:center; gap:.375rem}
  .ccard .ph{font-size:.75rem; color:#9aa8b1}
  .badge{border-radius:9999px; padding:.1rem .6rem; font-size:.72rem; font-weight:600; white-space:nowrap}
  .b-active{background:#dcfce7; color:#15803d} .b-frozen{background:rgba(63,169,221,.2); color:var(--brand)} .b-inactive{background:#f3f4f6; color:#6b7280}
  .b-review{background:#fef3c7; color:#b45309; font-size:.68rem}
  .b-health-ok{background:#dcfce7;color:#15803d} .b-health-no{background:#fef3c7;color:#b45309}

  .tabs{margin-bottom:1rem; display:inline-flex; flex-wrap:wrap; gap:.25rem; border:1px solid var(--line); background:rgba(255,255,255,.7); border-radius:9999px; padding:.25rem; box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .tabs button{border:0; cursor:pointer; border-radius:9999px; padding:.375rem 1rem; font-size:.875rem; color:#556; background:transparent; transition:.15s}
  .tabs button.on{background:linear-gradient(135deg,#0e7ea6,#0a5570); color:#fff; font-weight:600; box-shadow:0 6px 14px -8px rgba(10,85,112,.8)}

  .dcard{background:#fff; border:1px solid var(--line); border-radius:1rem; padding:1rem; box-shadow:var(--card-shadow)}
  .dcard>button{width:100%; display:flex; align-items:center; justify-content:space-between; gap:.5rem; text-align:right; border:0; background:transparent; cursor:pointer}
  .dcard .nm{font-weight:500; display:flex; align-items:center; gap:.375rem}
  .dcard .ph{font-size:.72rem; color:#9aa8b1; display:block}
  .owed{font-weight:700; color:var(--accent)}
  .escal{border-radius:.25rem; background:#fee2e2; color:#b91c1c; padding:.05rem .4rem; font-size:.62rem; font-weight:700}
  .ddetail{margin-top:.5rem; border-top:1px solid #eef1f3; padding-top:.5rem; font-size:.75rem; color:#6b7f8a}
  .ddetail .r{display:flex; justify-content:space-between}
  .ddetail .lk{display:block; padding-top:.375rem; color:var(--brand); cursor:pointer}

  .table{width:100%; border-collapse:collapse; font-size:.85rem}
  .table th{background:#f8fafc; text-align:right; font-size:.72rem; color:#6b7f8a; font-weight:500; padding:.5rem 1rem; white-space:nowrap}
  .table td{padding:.5rem 1rem; border-top:1px solid #eef1f3; white-space:nowrap; vertical-align:top}
  .table td.acc{color:var(--accent)} .table td.grn{color:#15803d; font-weight:500} .table td.sft{color:var(--soft)} .table td.b{font-weight:500} .table td.brand{color:var(--brand);font-weight:500}
  .table tr:hover td{background:#f8fbfd}
  .tablewrap{overflow-x:auto; border:1px solid #e5e7eb; border-radius:1rem; background:#fff}

  .ivchart{position:relative; height:16rem; padding-inline-start:3.5rem}
  .ivbars{position:absolute; inset:0; display:flex; align-items:flex-end; gap:.5rem; padding-inline-start:3.5rem}
  .ivbars .c{flex:1; min-width:34px; height:100%; display:flex; align-items:flex-end; justify-content:center; gap:.25rem}
  .ivbars .c i{width:45%; border-radius:.25rem .25rem 0 0}
  .ivbars .inc{background:linear-gradient(to top,#1B6E9B,#3FA9DD)} .ivbars .exp{background:linear-gradient(to top,#d43e64,#f4a0b4)}
  .tick{position:absolute; inset-inline:0; border-top:1px dashed #eef1f3}
  .tick span{position:absolute; top:-.6rem; inset-inline-start:0; background:#fff; padding-inline-end:.25rem; font-size:.62rem; color:#9aa8b1; font-variant-numeric:tabular-nums}
  .legend{display:flex; gap:1rem; font-size:.72rem; color:#6b7f8a}
  .legend i{display:inline-block; width:.75rem; height:.75rem; border-radius:.2rem; vertical-align:middle; margin-inline-end:.25rem}
  .sbar{margin-bottom:.75rem}
  .sbar .t{display:flex; justify-content:space-between; font-size:.85rem}
  .sbar .track{margin-top:.25rem; height:.5rem; border-radius:.25rem; background:#eef1f3}
  .sbar .track i{display:block; height:100%; border-radius:.25rem}

  /* week calendar */
  .wknav{display:flex; align-items:center; justify-content:space-between; margin-bottom:.75rem; flex-wrap:wrap; gap:.5rem}
  .wknav .navbtns{display:flex; gap:.5rem}
  .navbtn{border-radius:9999px; border:1px solid var(--line); background:#fff; padding:.35rem 1rem; font-size:.85rem; color:var(--brand); cursor:pointer; transition:.15s}
  .navbtn:hover{transform:translateY(-2px); border-color:var(--soft)}
  .weekwrap{overflow-x:auto; padding-bottom:.5rem}
  .week{display:grid; grid-template-columns:repeat(7,minmax(115px,1fr)); gap:.75rem; min-width:820px}
  .daycol{display:flex; flex-direction:column}
  .dayhead{margin-bottom:.5rem; border-radius:.5rem; padding:.5rem; text-align:center; background:#fff}
  .dayhead.today{background:var(--brand); color:#fff}
  .dayhead .wd{font-weight:600} .dayhead .dt{font-size:.72rem; color:#9aa8b1} .dayhead.today .dt{color:rgba(255,255,255,.8)}
  .dayhead .heb{font-size:.68rem; color:var(--soft)} .dayhead.today .heb{color:rgba(255,255,255,.7)}
  .lcard{display:block; border-radius:.5rem; border:1px solid #e5e7eb; border-right:4px solid var(--brand); background:#fff; padding:.5rem; font-size:.85rem; margin-bottom:.5rem}
  .lcard .lt{display:flex; align-items:center; gap:.375rem; font-weight:500; color:#374151}
  .lcard .lb{margin-top:.15rem; display:flex; justify-content:space-between; font-size:.72rem; color:#6b7f8a}
  .lcard .lb .full{color:var(--accent); font-weight:600}
  .empty-day{border-radius:.5rem; border:1px dashed #e5e7eb; padding:1.2rem 0; text-align:center; color:#d1d5db; font-size:.8rem}

  /* actions bar */
  .actbar{display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1.5rem}
  .actbar button{border-radius:9999px; border:1px solid var(--line); background:#fff; padding:.45rem 1rem; font-size:.85rem; color:var(--brand); cursor:pointer; transition:.15s; font-weight:500}
  .actbar button:hover{border-color:var(--soft); transform:translateY(-1px)}
  .actbar button.on{background:linear-gradient(135deg,#0e7ea6,#0a5570); color:#fff; border-color:transparent}
  .actpanel{background:#fff; border:1px solid var(--line); border-radius:1rem; padding:1.25rem; margin-bottom:1.5rem; box-shadow:var(--card-shadow)}

  .subrow{display:flex; align-items:center; justify-content:space-between; gap:.75rem; background:#fff; border:1px solid var(--line); border-radius:1rem; padding:.75rem 1rem; box-shadow:var(--card-shadow)}
  .subrow .nm{font-weight:500} .subrow .meta{font-size:.72rem; color:#6b7f8a; margin-top:.15rem}
  .lesscard{display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid var(--line); border-right:4px solid var(--brand); border-radius:1rem; padding:.5rem .9rem; box-shadow:var(--card-shadow)}
  .lesscard .d1{font-size:.85rem} .lesscard .d2{font-size:.72rem; color:#9aa8b1}
  .lstate{border-radius:9999px; padding:.05rem .5rem; font-size:.68rem; font-weight:500}
  .ls-future{background:rgba(63,169,221,.2); color:var(--brand)} .ls-past{background:#f3f4f6; color:#6b7280} .ls-cancel{background:#fee2e2; color:#dc2626}

  /* phone settings accordion */
  .acc{border:1px solid #e2e8f0; border-radius:.75rem; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.05); margin-bottom:1rem; overflow:hidden}
  .acc>summary{cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding:1rem 1.25rem}
  .acc>summary::-webkit-details-marker{display:none}
  .acc .stitle{font-size:1rem; font-weight:700; color:#1e293b; display:block}
  .acc .sdesc{font-size:.72rem; color:#64748b; display:block; margin-top:.15rem}
  .acc .chev{color:#94a3b8; transition:transform .2s}
  .acc[open] .chev{transform:rotate(180deg)}
  .acc .body{border-top:1px solid #f1f5f9; padding:1rem 1.25rem 1.25rem; display:flex; flex-direction:column; gap:1rem}
  .chk{display:flex; align-items:center; gap:.5rem; font-size:.875rem; color:#334155}
  .g2f{display:grid; grid-template-columns:1fr 1fr; gap:1rem}
  @media(max-width:600px){ .g2f{grid-template-columns:1fr} }
  .nikud{position:relative}
  .nikud .np{position:absolute; inset-inline-end:.5rem; top:.4rem; font-size:.68rem; color:var(--soft); background:#eaf6fc; border-radius:.5rem; padding:.1rem .5rem; cursor:pointer}
  .rec{display:flex; align-items:center; justify-content:space-between; gap:.75rem; border:1px solid #eef1f3; border-radius:.75rem; padding:.6rem .9rem; font-size:.85rem}
  .rec .st{font-size:.72rem; color:#64748b}
  .rec .st.human{color:#15803d;font-weight:500}
  .rec .acts{display:flex; gap:.4rem}
  .rec .acts button{border:1px solid var(--line); background:#fff; border-radius:.5rem; padding:.2rem .6rem; font-size:.72rem; cursor:pointer; color:var(--brand)}

  .setgrid{display:grid; gap:1rem; grid-template-columns:repeat(2,1fr)}
  @media(max-width:760px){ .setgrid{grid-template-columns:1fr} }
  .setcard{cursor:pointer; height:100%}
  .setcard h3{margin:0; font-weight:600; color:var(--brand)} .setcard p{margin:.25rem 0 0; font-size:.85rem; color:#6b7f8a}

  .callrow{display:flex; align-items:center; gap:.75rem; background:#fff; border:1px solid var(--line); border-radius:1rem; padding:.75rem 1rem; box-shadow:var(--card-shadow)}
  .callrow .cnt{display:grid;place-items:center;height:2rem;width:2rem;border-radius:9999px;background:rgba(224,90,121,.12);color:var(--accent);font-weight:700;font-size:.85rem;flex:none}
  .vm{font-size:.72rem;color:var(--brand);background:rgba(63,169,221,.15);border-radius:9999px;padding:.05rem .5rem}
  .backbtn{border:1px solid var(--line); background:#fff; border-radius:9999px; padding:.4rem 1rem; font-size:.85rem; color:var(--brand); cursor:pointer}

  .demo-tag{position:fixed; z-index:50; bottom:12px; inset-inline-start:12px; background:rgba(26,43,54,.9); color:#cfe6f0; font-size:.7rem; padding:.4rem .7rem; border-radius:9999px; box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
</style>

<div class="shell">
  <aside class="side">
    <div class="bubbles" aria-hidden="true">
      <i style="left:12%;width:12px;height:12px;animation-duration:13s"></i>
      <i style="left:34%;width:7px;height:7px;animation-duration:9s;animation-delay:1s"></i>
      <i style="left:62%;width:15px;height:15px;animation-duration:15s;animation-delay:.5s"></i>
      <i style="left:83%;width:9px;height:9px;animation-duration:10s;animation-delay:2s"></i>
    </div>
    <div class="side-head">
      <img src="logo.png" alt="זרמים">
      <p class="who">משתמשת דמו · מנהלת</p>
      <div class="deptsw" id="deptsw">
        <button data-dep="water_aerobics" class="on-wa">התעמלות מים</button>
        <button data-dep="swimming">שחייה</button>
